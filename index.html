<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AWS Certified Cloud Practitioner - Reproductor de Videos</title>
    <style>
      /* Dark Netflix-like responsive theme */
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%}
      body{font-family:Inter,'Segoe UI',Tahoma,Arial;background:#071018;color:#e6eef8;padding:0 16px 60px;-webkit-font-smoothing:antialiased}
      .container{max-width:1400px;margin:0 auto}

      .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:8px;flex-wrap:wrap}
      .logo{color:#e50914;font-weight:800;font-size:1.4rem}
      .nav-actions{display:flex;gap:8px;align-items:center;width:100%;justify-content:space-between;margin-top:8px}
      .search-input{background:#0b1317;border:1px solid #182027;color:#cfe7ff;padding:10px 12px;border-radius:6px;flex:1;min-width:150px;font-size:1rem}
      .search-input::placeholder{color:#7b8b98}
      .profile{width:36px;height:36px;background:#0f1619;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#9fb2c9;flex-shrink:0}

      .stats{display:flex;gap:10px;margin:12px 0 20px;overflow-x:auto;padding-bottom:6px}
      .stat-card{background:#071014;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);flex-shrink:0}
      .stat-number{font-size:1.2rem;font-weight:700}.stat-label{font-size:.75rem;color:#9fb2c9}

      .videos-grid{display:grid;grid-template-columns:1fr;gap:16px}
      .section-card{background:transparent}
      .section-header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
      .section-header h2{font-size:1rem;color:#dbeeff}
      .video-count{color:#6f8ea6;font-size:.8rem}
      .section-actions{display:flex;align-items:center;gap:8px}
      .section-action-btn{background:transparent;border:1px solid rgba(255,255,255,0.04);color:#cfe7ff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.95rem}
      .section-action-btn:hover{background:rgba(255,255,255,0.02)}

      .videos-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
      .videos-list::-webkit-scrollbar{height:8px}.videos-list::-webkit-scrollbar-thumb{background:#1f2933;border-radius:10px}

      /* Carousel arrows and fades */
      .carousel-wrap{position:relative;width:100%;max-width:100vw;overflow:hidden}
      .carousel-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:linear-gradient(90deg,rgba(7,16,24,.85),rgba(7,16,24,.55));border:none;color:#e6eef8;width:44px;height:80px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0.95;box-sizing:border-box}
      .carousel-btn.left{left:6px}
      .carousel-btn.right{right:6px}
      .carousel-fade{position:absolute;top:0;bottom:0;width:80px;pointer-events:none;max-width:20vw}
      /* Prevent global horizontal scroll caused by out-of-flow elements */
      html,body{overflow-x:hidden}
      .carousel-fade.left{left:0;background:linear-gradient(90deg,rgba(7,16,24,1),rgba(7,16,24,0))}
      .carousel-fade.right{right:0;background:linear-gradient(270deg,rgba(7,16,24,1),rgba(7,16,24,0))}

      .video-item{min-width:140px;max-width:200px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
      .video-thumb{width:100%;height:90px;border-radius:4px;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.55));display:flex;align-items:flex-end;padding:8px;color:#fff;font-weight:500;font-size:.7rem;box-shadow:0 4px 12px rgba(0,0,0,.5);position:relative;transition:transform .2s ease}
      .video-item:active .video-thumb{transform:scale(.95)}
      .video-thumb::after{content:'▶';position:absolute;right:8px;top:8px;background:rgba(0,0,0,.4);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
      .video-title{font-size:.85rem;color:#cfe7ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2}
      .video-sub{font-size:.75rem;color:#7b8b98}

      .player-section{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,10,.95);visibility:hidden;opacity:0;transition:opacity .25s ease;z-index:1200;padding:12px}
      .player-section.active{visibility:visible;opacity:1}
      .player-card{width:100%;max-width:1200px;background:#071018;border-radius:8px;padding:12px;box-shadow:0 20px 60px rgba(0,0,0,.9)}
      .video-player{width:100%;height:auto;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden}
      .video-player video{width:100%;height:100%;object-fit:contain;background:#000}
      .player-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:10px;gap:8px;color:#cfe7ff}
      .player-title{flex:1;min-width:150px;font-size:.95rem}
      .player-controls{display:flex;gap:8px;align-items:center}
      .nav-btn{background:#1b2228;border:1px solid #23313a;color:#9fb2c9;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:.9rem;transition:background .2s ease;white-space:nowrap}
      .nav-btn:hover{background:#23313a}
      .nav-btn:disabled{opacity:.4;cursor:not-allowed}
      .close-btn{background:#0b0f14;border:1px solid #23313a;color:#9fb2c9;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:.9rem}

      .no-videos{color:#7b8b98;padding:40px;text-align:center}
      .footer{text-align:center;color:#6f8ea6;margin-top:40px;font-size:.85rem}
      
      @media(max-width:768px){
        body{padding:0 12px 40px}
        .topbar{padding:10px 0}
        .nav-actions{margin-top:6px}
        .logo{font-size:1.2rem}
        .stats{margin:10px 0 16px}
        .video-item{min-width:120px;max-width:160px}
        .video-thumb{height:80px}
        .player-card{padding:10px}
        .player-meta{flex-direction:column;align-items:flex-start}
        .player-controls{width:100%}
        .nav-btn{flex:1}
        .video-player{aspect-ratio:16/9}
      }
      @media(max-width:480px){
        body{padding:0 10px 40px}
        .logo{font-size:1.1rem}
        .nav-actions{gap:6px}
        .search-input{font-size:.9rem;padding:8px 10px}
        .video-item{min-width:100px;max-width:140px}
        .video-thumb{height:70px;font-size:.65rem}
        .stat-card{padding:8px 10px}
        .stat-number{font-size:1rem}
        .stat-label{font-size:.7rem}
        .player-title{font-size:.85rem}
        .nav-btn{padding:6px 10px;font-size:.8rem}
      }
    </style>
        <div class="topbar">
          <div style="display:flex;align-items:center;gap:18px">
            <div class="logo">CLOUD</div>
            <div style="color:#9fb2c9">AWS Certified Cloud Practitioner</div>
          </div>

          <div class="nav-actions">
            <input type="text" id="searchInput" class="search-input" placeholder="Buscar videos, módulos..." />
            <div class="profile">RL</div>
          </div>
        </div>

        <!-- <div class="stats" id="stats">
          <div class="stat-card"><div class="stat-number" id="totalSections">0</div><div class="stat-label">Módulos</div></div>
          <div class="stat-card"><div class="stat-number" id="totalVideos">0</div><div class="stat-label">Videos totales</div></div>
          <div class="stat-card"><div class="stat-number" id="foundVideos">0</div><div class="stat-label">Videos encontrados</div></div>
        </div> -->
      <div class="player-section" id="playerSection">
        <div class="player-card">
          <div class="video-player">
            <video id="videoPlayer" controls>
              Tu navegador no soporta video HTML5
            </video>
          </div>
          <div class="player-meta">
            <div class="player-title">
              <div id="videoTitle">Selecciona un video</div>
              <div id="videoSection" style="font-size:.8rem;color:#9fb2c9">Módulo</div>
            </div>
            <div class="player-controls">
              <button class="nav-btn" id="prevBtn" title="Video anterior">← Anterior</button>
              <button class="nav-btn" id="nextBtn" title="Siguiente video">Siguiente →</button>
              <button class="close-btn" id="closeBtn" title="Cerrar reproductor">✕</button>
            </div>
          </div>
        </div>
      </div>

      <!-- <div id="noVideoMessage" class="no-videos">
        <p>No se encontraron videos.</p>
        <p>
          Por favor, asegúrate de que los videos están en la carpeta correcta.
        </p>
      </div> -->

      <div class="videos-grid" id="videosGrid">
        <div class="loading">Cargando videos...</div>
      </div>

      <div class="footer">
        <p>© 2024 - AWS Certified Cloud Practitioner | Reproductor Local</p>
      </div>
    </div>

    <script>
      const videoData = {};
      let filteredSections = {};
      let currentVideo = null;
      let videoQueue = []; // Cola de videos para reproducción automática
      let currentQueueIndex = -1;

      // Cargar datos de videos desde archivo JSON
      async function loadVideos() {
        try {
          const response = await fetch("/videos-data.json");
          if (!response.ok) throw new Error("Error al cargar datos");
          const data = await response.json();

          Object.assign(videoData, data);
          updateStats();
          renderVideos();
        } catch (error) {
          console.error("Error cargando videos:", error);
          renderNoVideos();
        }
      }

      function updateStats() {
        const sections = Object.keys(videoData).length;
        const totalVideos = Object.values(videoData).reduce(
          (sum, section) => sum + section.length,
          0
        );

        const totalSectionsEl = document.getElementById("totalSections");
        const totalVideosEl = document.getElementById("totalVideos");
        const foundVideosEl = document.getElementById("foundVideos");

        if (totalSectionsEl) totalSectionsEl.textContent = sections;
        if (totalVideosEl) totalVideosEl.textContent = totalVideos;
        if (foundVideosEl) foundVideosEl.textContent = totalVideos;
      }

      function renderVideos(filteredData = null) {
        const grid = document.getElementById("videosGrid");
        const noVideoMsg = document.getElementById("noVideoMessage");
        const dataToRender = filteredData || videoData;

        if (Object.keys(dataToRender).length === 0) {
          renderNoVideos();
          return;
        }

        grid.innerHTML = "";
        if (noVideoMsg) noVideoMsg.classList.remove("active");

        Object.entries(dataToRender).forEach(([section, videos]) => {
          const card = document.createElement("div");
          card.className = "section-card";

          const headerDiv = document.createElement("div");
          headerDiv.className = "section-header";
          headerDiv.innerHTML = `
                    <h2 class="section-title">
                        ${section}
                        <span class="video-count">${videos.length} ${
            videos.length === 1 ? "video" : "videos"
          }</span>
                    </h2>
                `;

          // Add a right-side action button in the header to scroll carousel to the right
          const actionsWrap = document.createElement('div');
          actionsWrap.className = 'section-actions';
          const headerActionBtn = document.createElement('button');
          headerActionBtn.className = 'section-action-btn';
          headerActionBtn.title = 'Ver más';
          headerActionBtn.innerText = 'Ver más →';
          actionsWrap.appendChild(headerActionBtn);
          headerDiv.appendChild(actionsWrap);

          const listDiv = document.createElement("div");
          listDiv.className = "videos-list";

          // Wrap to allow overlayed carousel buttons
          const carouselWrap = document.createElement("div");
          carouselWrap.className = "carousel-wrap";

          // Ensure list starts at left (Netflix-like)
          listDiv.scrollLeft = 0;
          listDiv.style.scrollBehavior = 'smooth';

          videos.forEach((video, index) => {
            const item = document.createElement("div");
            item.className = "video-item";

            const thumb = document.createElement("div");
            thumb.className = "video-thumb";
            // Optionally show a short label inside the thumb (hidden by CSS if not needed)
            const thumbLabel = document.createElement('div');
            thumbLabel.style.fontSize = '0.85rem';
            thumbLabel.style.opacity = '0.95';
            thumbLabel.textContent = '';
            thumb.appendChild(thumbLabel);

            const titleLabel = document.createElement("div");
            titleLabel.className = "video-title";
            titleLabel.title = video.name;
            titleLabel.textContent = video.name;

            const subLabel = document.createElement("div");
            subLabel.className = "video-sub";
            subLabel.textContent = section;

            const playBtn = document.createElement("button");
            playBtn.className = "play-button";
            playBtn.textContent = "▶";
            playBtn.onclick = (e) => {
              e.stopPropagation();
              playVideo(video, section);
            };

            item.appendChild(thumb);
            item.appendChild(titleLabel);
            item.appendChild(subLabel);
            item.appendChild(playBtn);

            item.onclick = () => playVideo(video, section);

            listDiv.appendChild(item);
          });

            // Create left/right carousel buttons
            const leftBtn = document.createElement('button');
            leftBtn.className = 'carousel-btn left';
            leftBtn.innerHTML = '‹';
            leftBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const scrollAmount = Math.max(listDiv.clientWidth * 0.75, 260);
              listDiv.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            });

            const rightBtn = document.createElement('button');
            rightBtn.className = 'carousel-btn right';
            rightBtn.innerHTML = '›';
            rightBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const scrollAmount = Math.max(listDiv.clientWidth * 0.75, 260);
              listDiv.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            });

            // Optional fade overlays
            const fadeLeft = document.createElement('div');
            fadeLeft.className = 'carousel-fade left';
            const fadeRight = document.createElement('div');
            fadeRight.className = 'carousel-fade right';

            carouselWrap.appendChild(leftBtn);
            carouselWrap.appendChild(fadeLeft);
            carouselWrap.appendChild(listDiv);
            carouselWrap.appendChild(fadeRight);
            carouselWrap.appendChild(rightBtn);

            card.appendChild(headerDiv);
            card.appendChild(carouselWrap);

            // Hide arrows if no horizontal overflow and update fades
            const updateCarouselUI = () => {
              const hasOverflow = listDiv.scrollWidth > listDiv.clientWidth + 1;
              leftBtn.style.display = hasOverflow ? 'flex' : 'none';
              rightBtn.style.display = hasOverflow ? 'flex' : 'none';
              fadeLeft.style.display = hasOverflow ? 'block' : 'none';
              fadeRight.style.display = hasOverflow ? 'block' : 'none';
              // Also toggle the header action button visibility
              try {
                headerActionBtn.style.display = hasOverflow ? 'inline-flex' : 'none';
              } catch (e) {}
            };

            // Initial update and listeners
            // run after next paint to ensure metrics are correct
            requestAnimationFrame(updateCarouselUI);
            listDiv.addEventListener('scroll', () => {
              // show/hide fades based on scroll position
              const atStart = listDiv.scrollLeft <= 2;
              const atEnd = listDiv.scrollLeft + listDiv.clientWidth >= listDiv.scrollWidth - 2;
              fadeLeft.style.opacity = atStart ? '0' : '1';
              fadeRight.style.opacity = atEnd ? '0' : '1';
            });

            window.addEventListener('resize', () => {
              // debounce quick resize
              clearTimeout(window.__carouselResize);
              window.__carouselResize = setTimeout(updateCarouselUI, 120);
            });

            // Wire the header action button to scroll right when clicked
            try {
              headerActionBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const scrollAmount = Math.max(listDiv.clientWidth * 0.75, 260);
                listDiv.scrollBy({ left: scrollAmount, behavior: 'smooth' });
              });
            } catch (e) {}
          grid.appendChild(card);
        });
      }

      function renderNoVideos() {
        const grid = document.getElementById("videosGrid");
        const noVideoMsg = document.getElementById("noVideoMessage");

        grid.innerHTML = "";
        if (noVideoMsg) noVideoMsg.classList.add("active");
      }

      function playVideo(video, section) {
        const playerSection = document.getElementById("playerSection");
        const videoPlayer = document.getElementById("videoPlayer");
        const videoTitle = document.getElementById("videoTitle");
        const videoSectionDiv = document.getElementById("videoSection");

        if (!playerSection || !videoPlayer || !videoTitle || !videoSectionDiv) {
          console.error("Elementos del reproductor no encontrados");
          return;
        }

        currentVideo = { ...video, section };

        // Usar la ruta relativa del servidor HTTP con codificación correcta
        // Codificar la ruta para que funcione con espacios y caracteres especiales
        const encodedPath =
          "/" +
          video.path
            .split("/")
            .map((part) => encodeURIComponent(part))
            .join("/");
        videoPlayer.src = encodedPath;
        videoTitle.textContent = video.name;
        videoSectionDiv.textContent = section;

        playerSection.classList.add("active");
        playerSection.scrollIntoView({ behavior: "smooth" });

        // Resaltar el video en la lista
        document.querySelectorAll(".video-item").forEach((item) => {
          item.classList.remove("active");
        });
        event?.target?.closest(".video-item")?.classList.add("active");

        // Construir la cola de reproducción automática
        buildVideoQueue(section, video);

        // Reproducir el video
        videoPlayer.play();
      }

      // Construir cola de videos para reproducción automática
      function buildVideoQueue(startSection, startVideo) {
        videoQueue = [];
        currentQueueIndex = -1;

        const sections = Object.keys(videoData).sort();
        let foundStart = false;

        // Agregar todos los videos comenzando desde el video inicial
        sections.forEach((section) => {
          if (section === startSection) {
            foundStart = true;
            const videos = videoData[section];
            const startIndex = videos.findIndex(
              (v) => v.path === startVideo.path
            );

            // Agregar desde el video inicial hasta el final de la sección
            for (let i = startIndex; i < videos.length; i++) {
              videoQueue.push({ video: videos[i], section });
            }
          } else if (foundStart) {
            // Agregar todos los videos de las siguientes secciones
            videoData[section].forEach((video) => {
              videoQueue.push({ video, section });
            });
          }
        });

        currentQueueIndex = 0;
      }

      // Reproducir el siguiente video en la cola
      function playNextVideo() {
        if (videoQueue.length === 0) {
          console.log("No hay más videos en la cola");
          return;
        }

        currentQueueIndex++;

        if (currentQueueIndex >= videoQueue.length) {
          console.log("Se terminó la reproducción de todos los videos");
          currentQueueIndex = -1;
          return;
        }

        const nextItem = videoQueue[currentQueueIndex];
        playVideo(nextItem.video, nextItem.section);
      }

      // Reproducir el video anterior en la cola
      function playPrevVideo() {
        if (videoQueue.length === 0) {
          console.log("No hay videos en la cola");
          return;
        }

        currentQueueIndex--;

        if (currentQueueIndex < 0) {
          console.log("No hay video anterior");
          currentQueueIndex = 0;
          return;
        }

        const prevItem = videoQueue[currentQueueIndex];
        playVideo(prevItem.video, prevItem.section);
      }

      // Guardar progreso del video en localStorage
      function saveVideoProgress(videoPath, currentTime) {
        if (!currentVideo) return;
        const progress = {
          path: videoPath,
          currentTime: currentTime,
          section: currentVideo.section,
          name: currentVideo.name,
          timestamp: new Date().toISOString()
        };
        localStorage.setItem("cloudpractitioner_lastVideo", JSON.stringify(progress));
      }

      // Restaurar y reproducir el último video visto
      function restoreVideoProgress() {
        const saved = localStorage.getItem("cloudpractitioner_lastVideo");
        if (!saved) return;

        try {
          const progress = JSON.parse(saved);
          const videoPlayer = document.getElementById("videoPlayer");

          // Buscar el video en los datos cargados
          let foundVideo = null;
          let foundSection = null;

          Object.entries(videoData).forEach(([section, videos]) => {
            const video = videos.find(v => v.path === progress.path);
            if (video) {
              foundVideo = video;
              foundSection = section;
            }
          });

          if (foundVideo && foundSection) {
            // Reproducir el video guardado
            playVideo(foundVideo, foundSection);

            // Esperar a que el video se cargue y luego buscar la posición guardada
            videoPlayer.addEventListener("loadedmetadata", () => {
              if (videoPlayer.currentTime !== progress.currentTime) {
                videoPlayer.currentTime = progress.currentTime;
              }
            }, { once: true });
          }
        } catch (error) {
          console.error("Error restaurando video:", error);
        }
      }

      // Agregar listeners para botones de navegación
      document.addEventListener("DOMContentLoaded", () => {
        const nextBtn = document.getElementById("nextBtn");
        const prevBtn = document.getElementById("prevBtn");
        const closeBtn = document.getElementById("closeBtn");
        const videoPlayer = document.getElementById("videoPlayer");

        if (nextBtn) {
          nextBtn.addEventListener("click", playNextVideo);
        }

        if (prevBtn) {
          prevBtn.addEventListener("click", playPrevVideo);
        }

        if (closeBtn) {
          closeBtn.addEventListener("click", () => {
            document.getElementById("playerSection").classList.remove("active");
            if (videoPlayer) videoPlayer.pause();
          });
        }

        // Guardar progreso cada 5 segundos mientras se reproduce
        if (videoPlayer) {
          let saveInterval = null;
          videoPlayer.addEventListener("play", () => {
            saveInterval = setInterval(() => {
              if (currentVideo) {
                saveVideoProgress(currentVideo.path, videoPlayer.currentTime);
              }
            }, 5000);
          });

          videoPlayer.addEventListener("pause", () => {
            if (saveInterval) {
              clearInterval(saveInterval);
              if (currentVideo) {
                saveVideoProgress(currentVideo.path, videoPlayer.currentTime);
              }
            }
          });

          videoPlayer.addEventListener("ended", () => {
            if (saveInterval) clearInterval(saveInterval);
            playNextVideo();
          });
        }
      });

      // Búsqueda
      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          const searchTerm = e.target.value.toLowerCase();

          if (!searchTerm) {
            renderVideos();
            updateStats();
            return;
          }

          const filtered = {};
          let foundCount = 0;

          Object.entries(videoData).forEach(([section, videos]) => {
            const filteredVideos = videos.filter(
              (video) =>
                video.name.toLowerCase().includes(searchTerm) ||
                section.toLowerCase().includes(searchTerm)
            );

            if (filteredVideos.length > 0) {
              filtered[section] = filteredVideos;
              foundCount += filteredVideos.length;
            }
          });

          const foundVideosEl = document.getElementById("foundVideos");
          if (foundVideosEl) foundVideosEl.textContent = foundCount;
          renderVideos(filtered);
        });
      }

      // Cargar videos al iniciar
      loadVideos().then(() => {
        // Restaurar último video después de cargar los datos
        restoreVideoProgress();
      });
    </script>
  </body>
</html>
